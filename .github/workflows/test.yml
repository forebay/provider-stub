name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node
      runners: '["ubuntu-latest","windows-latest","macos-latest"]'
      node_install: npm ci --prefix siblings/host/siblings/model && npm ci --prefix siblings/host/siblings/typescript && npm ci --prefix siblings/host && npm ci
      node_build: cmake -S siblings/forebay-library -B siblings/forebay-library/build && cmake --build siblings/forebay-library/build --config Release --target forebay_library && npm run build --prefix siblings/host/siblings/typescript && npm run build --prefix siblings/host && npm run build
      node_test: npm test
